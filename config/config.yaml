meta:
  status: "provvisory"        # "synthetic" | "provvisory" | "real" -> it blocks the final run if != "real"
  currency: "USD"
  scale: "billions"          # of USD
  valuation_date: "2026-10-21"
  horizon_years: 10          # H = 10 years projection

simulation:
  seed: 42                   # does not metter what you choose but fixing it from the beginning allows reproducibility of our simiulation if we would like to check somenthing
  n_paths: 10000

revenues:
  r0: 93.925                     # we will receive the actual data from gropus G1 and G4
  sigma: 0.052941                # annual volatility (provvisory)
  g_path: [0.04, 0.04, 0.04, 0.04, 0.04, 0.035, 0.035, 0.03, 0.03, 0.03]

fcff_parameters:            # these data should arrive from G2
  status: "provvisory"                                 # "provvisory" | "real" -> it blocks the final run if != "real"
  m_growth: [0.1538, 0.1538, 0.1538, 0.1538, 0.1538]      # core op. margin FY2025, 14.912/93.925, p. 42; restructuring rule open
  m_inf: 0.1533                                       # placeholder until D14
  tau_growth: [0.19, 0.19, 0.19, 0.19, 0.19]         # effective rate FY2025, 1.949/10.244, p. 57
  tau_inf: 0.21                                      # US statutory, same as G3's WACC (to confirm, H10)
  da: [0.035, 0.035, 0.035, 0.035, 0.035]            # D&A / revenue, FY2016-25 average, excl. ROU amortisation
  capex: [0.055, 0.055, 0.055, 0.055, 0.055]         # capex / revenue, FY2016-25 average (gross of PP&E sales)
  nwc: [-0.031, -0.031, -0.031, -0.031, -0.031]      # pooled 2016-25: (-3.703 + 2.724) / (93.925 - 62.799), Antonio
  g_inf: 0.025                                       # placeholder until G3 (G1's g* = 2.5%)
  roic_inf: 0.20                                     # placeholder until D14
  k: 0.5                                         # course guide p. 28, same k as G1's scenarios

rates_and_terminal:          # G3 (D08 v1) + G2
  price_share: 138.83        # Chiusura 2026-10-22
  rf: 0.0496                 # 10Y Treasury FRED DGS10
  erp: 0.042                 # Implied ERP Damodaran
  rd: 0.0566                 # Pre-tax cost of debt (A+)
  beta_growth: 0.52          # Beta osservato PEP (provvisorio in attesa di D09)
  beta_maturity: 0.80        # Ipotesi G3 di convergenza a maturità
  k_transition: 0.5          # Velocità di convergenza WACC anni 6-10
  diluted_shares: 1.366
  debt_total_wacc: 51.881    # 9.223 (short-term) + 42.658 (long-term)
  g_terminal: 0.02           # g_inf provvisorio
  roic_terminal: 0.10        # ROIC_inf provvisorio
  margin_terminal: 0.16      # da allineare con G2
  tax_terminal: 0.21         # H10

bridge:                      # G3 (Ponte EV -> Equity, somma attesa: -41.111 USD bn)
  diluted_shares: 1.366
  items:
    cash_and_equivalents: 10.675
    short_term_investments: 0.488
    tropicana_39_pct: 0.0
    celsius_convertible_preferred: 1.482
    short_term_debt: -9.223
    long_term_debt: -42.658
    euro_notes_oct_2026: -1.126
    pension_and_medical_after_tax: -0.55379   # -(0.233 + 0.468) * (1 - 0.21)
    non_controlling_interests: -0.195
  provisional_items:
    - "cash_and_equivalents"
    - "short_term_investments"
    - "celsius_convertible_preferred"
    - "short_term_debt"
    - "long_term_debt"
    - "euro_notes_oct_2026"
    - "pension_and_medical_after_tax"
    - "non_controlling_interests"
    - "diluted_shares"
